services:
  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    # Host 5433 evita choque con Postgres instalado en Windows (suele usar 5432).
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_dev
      POSTGRES_DB: evolution_erp
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

volumes:
  evolution_pgdata:
